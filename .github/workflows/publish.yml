name: Publish

# Pushing a `<package>/v<version>` tag (created by bin/release.sh) publishes that package to npm,
# then to GitHub Packages and creates the GitHub release from the package `CHANGELOG.md`.
on:
  push:
    tags:
      - '*/v*'

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing

    outputs:
      package_name: ${{ steps.package.outputs.name }}

    steps:
      - name: Get package name from tag
        id: package
        run: echo "name=${GITHUB_REF_NAME%%/*}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check package exists
        run: |
          if [ ! -f "packages/${{ steps.package.outputs.name }}/package.json" ]; then
            echo "No package for tag ${GITHUB_REF_NAME} (expected <package>/v<version>)"
            exit 1
          fi

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24 # npm >= 11.5.1 is required for Trusted Publishing
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        working-directory: packages/${{ steps.package.outputs.name }}
        run: npm publish --access public

  publish-github:
    needs: publish-npm
    if: contains(fromJSON('["biome-config", "commitlint-config"]'), needs.publish-npm.outputs.package_name)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup node for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@untile'

      - name: Publish to GitHub Packages
        working-directory: packages/${{ needs.publish-npm.outputs.package_name }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Body of the first `## ` section (the release added by bin/release.sh).
      - name: Create GitHub release from changelog
        run: |
          awk '/^## /{ section++; next } section == 1' "packages/${PACKAGE_NAME}/CHANGELOG.md" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ needs.publish-npm.outputs.package_name }}
