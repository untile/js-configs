name: Publish

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing

    outputs:
      package_name: ${{ steps.package.outputs.name }}

    steps:
      # Tags follow `<package>/v<version>` (see bin/release.sh).
      - name: Get package name from tag
        id: package
        run: echo "name=${GITHUB_REF_NAME%%/*}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The name comes from the tag, so it reaches the script through `env`, never interpolated.
      - name: Check package exists
        run: |
          if [ ! -f "packages/${PACKAGE_NAME}/package.json" ]; then
            echo "No package for tag ${GITHUB_REF_NAME} (expected <package>/v<version>)"
            exit 1
          fi
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24 # npm >= 11.5.1 is required for Trusted Publishing
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        working-directory: packages/${{ steps.package.outputs.name }}
        run: npm publish --access public

  publish-github:
    needs: publish-npm
    if: contains(fromJSON('["biome-config", "commitlint-config"]'), needs.publish-npm.outputs.package_name)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup node for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@untile'

      - name: Publish to GitHub Packages
        working-directory: packages/${{ needs.publish-npm.outputs.package_name }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
