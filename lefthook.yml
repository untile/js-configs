# lefthook.yml
# Git hooks configuration using Lefthook v2.0.0
# https://github.com/evilmartians/lefthook

# Require minimum Lefthook version
min_version: 2.0.0

# Pre-commit hook
pre-commit:
  parallel: true
  commands:
    # 1️⃣ Sort package.json files first (priority 1 = highest)
    sort-package-json:
      priority: 1
      glob:
        - "package.json"
        - "**/package.json"
      exclude: "**/test/fixtures/**"
      run: npx sort-package-json {staged_files}
      stage_fixed: true

    # 2️⃣ Lint JS/TS files in their respective packages (priority 2)
    eslint:
      priority: 2
      glob: "**/*.{js,ts,tsx}"
      exclude: "test/fixtures/**/*"
      run: |
        for file in {staged_files}; do
          # Skip test fixtures
          if [[ "$file" =~ test/fixtures/ ]]; then
            continue
          fi
          # Skip config files
          if [[ "$file" =~ (jest.config|eslint.config|tsconfig) ]]; then
            continue
          fi
          pkg_dir=$(echo "$file" | sed 's|packages/\([^/]*\).*|packages/\1|')
          if [ -f "$pkg_dir/eslint.config.js" ]; then
            relative_file=$(echo "$file" | sed "s|$pkg_dir/||")
            (cd "$pkg_dir" && npx eslint "$relative_file") || exit 1
          fi
        done
      stage_fixed: true

    # 2️⃣ Check JS/TS files with Biome in the packages linted by Biome (priority 2)
    biome:
      priority: 2
      glob: "packages/**/*.{js,ts,tsx}"
      exclude: "**/test/fixtures/**"
      run: |
        for file in {staged_files}; do
          pkg_dir=$(echo "$file" | sed 's|packages/\([^/]*\).*|packages/\1|')
          if [ -f "$pkg_dir/biome.json" ]; then
            relative_file=$(echo "$file" | sed "s|$pkg_dir/||")
            (cd "$pkg_dir" && npx biome check --write --no-errors-on-unmatched "$relative_file") || exit 1
          fi
        done
      stage_fixed: true

# Commit message hook
commit-msg:
  commands:
    # Validate commit message with commitlint
    commitlint:
      run: npm exec -- commitlint --edit {1}
